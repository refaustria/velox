# Optional snippet for the games.inceptum.at server block (NOT applied; the live vhost already has working
# `location /`, `/downloads/`, `/status/` blocks, see infra/nginx/games.inceptum.at.conf). Use it to REPLACE those three blocks:
# copy to /etc/nginx/snippets/velox-locations.conf and put `include snippets/velox-locations.conf;` inside the server block,
# then `nginx -t && systemctl reload nginx` (a stated root step). Static content only; veloxmaster (127.0.0.1:8790) is NOT proxied.

# Static site from infra/www (rsync'd to the web root).
location / {
    try_files $uri $uri/ =404;
}

# Client downloads: downloads/index.html and latest.json are generated by infra/deploy/publish-download.sh.
location /downloads/ {
    autoindex off;
    default_type application/octet-stream;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'" always;
}
location = /downloads/latest.json {
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /downloads/index.html {
    add_header Cache-Control "no-cache" always;
}
# Archives are immutable per version directory.
location ~ ^/downloads/[^/]+/Velox-.*\.(zip|zst)$ {
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Server list written by veloxmaster; never cached.
location /status/ {
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    try_files $uri =404;
}
