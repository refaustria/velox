#!/usr/sbin/nft -f
# Velox host firewall (ADR 0007 section 2, task m6-online/06, human decision q44).
# Inbound allow-list: loopback, established/related, ICMP, TCP 22/80/443, UDP 7777. Everything else on `input` is dropped
# (TCP 8765 and 3000 are deliberately closed, q44). `forward` and `output` are not touched: docker manages forward, and docker
# publishes only on 127.0.0.1 here, so it is unaffected by this table.
#
# The file owns one table (inet velox_fw) and never flushes the ruleset, so docker's own tables survive a reload.
# Idempotent: "table" creates it if missing, "delete table" removes it, then it is created fresh -- all in one atomic transaction.
# Check only:  nft -c -f infra/firewall/nftables.conf      Apply: see README.md (armed rollback first!)

table inet velox_fw
delete table inet velox_fw

table inet velox_fw {
	chain input {
		type filter hook input priority filter; policy drop;

		ct state invalid drop
		ct state established,related accept
		iifname "lo" accept

		# Containers talking to the host (docker bridges); internal only, never the public interface ens18.
		iifname { "docker0" } accept
		iifname "br-*" accept

		# ICMP / ICMPv6 (neighbour discovery and path MTU must work; echo is rate limited).
		ip protocol icmp icmp type echo-request limit rate 10/second burst 20 packets accept
		ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
		ip6 nexthdr icmpv6 icmpv6 type echo-request limit rate 10/second burst 20 packets accept
		ip6 nexthdr icmpv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

		# DHCP client replies (initial lease / rebind).
		udp sport 67 udp dport 68 accept

		# Public services.
		tcp dport { 22, 80, 443 } accept
		udp dport 7777 accept comment "velox-server@ffa"
		# udp dport 7778 accept comment "velox-server@duel"   # one line per further instance (VELOX_PORT)

		# q44: TCP 8765 and 3000 were proposed to stay open; the human decided they stay CLOSED. To open them again:
		# tcp dport { 8765, 3000 } accept

		# Everything else: dropped by the chain policy.
	}
}
