+BotNames=Fulmen
+BotNames=Saltus
+BotNames=Praeceps
+BotNames=Nimbus
PathQueryCandidates=4.0
RoamRadiusCm=3000.0
; ADR 0005 D4 (task 04b): fight score parameters (item-score units) and the section 4 maneuver constants.
FightBaseScore=12.0
FightFullStrength=200.0
FightWeakWeaponScale=0.25
; ADR 0005 D22 (task 04d): an unowned weapon's need falls to this floor as the bot's WeaponStrength reaches 1.
UnownedWeaponNeedFloor=0.3
LinkStartAcceptanceCm=30.0
JumpFastSpeedFraction=0.9
JumpFastRunUpCm=600.0
JumpFastRetries=1
RocketJumpImpulseTimeoutSeconds=0.3
LinkEndAcceptanceCm=150.0
TakeoffLeadCm=100.0
; ADR 0005 D28 (task 04f): link traversal timeout and below-start guard; D29: ground hop heading gate.
LinkTimeoutSeconds=6.0
LinkBelowStartCm=100.0
MaxHopHeadingDeg=45.0
HopHeadingMinSpeedCmS=100.0
StuckSeconds=2.0
; ADR 0005 D35 (task 04g): segment line-of-walk check interval and the grazed-corner clearance (repath when blocked).
SegmentBlockCheckSeconds=0.25
SegmentBlockClearanceCm=100.0
; ADR 0005 D41 (task 04i): one vertical half extent for every grounded on-mesh projection (controller, router, D35 check).
OnMeshHalfHeightCm=100.0
BudgetWarnMicroseconds=600.0
DeterministicSeed=0

[/Script/Velox.VeloxBotCombatSettings]
; ADR 0005 D23 (task 04d): routing under fire keeps its speed (path weight of the overlay blend; header default 0.5).
FightPathWeight=1.5
; ADR 0005 D51 (2)(a) (task m4-followups/03b): FireInterval <= this = automatic weapon (MG, LG, PG get the D50 spray fields; header default 0.15 as well).
SprayMaxFireInterval=0.15

[/Script/Velox.VeloxBotItemRouter]
; ADR 0005 D50 (3): duellers camp more (D39 had 7, D50 10; task m4-followups/03 tuned to 11 inside the [9, 12] window; header default 11 as well).
DuelCampOverScore=11.0

