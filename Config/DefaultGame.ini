; Velox - game configuration (ADR 0001 sections 1 and 2).

[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=19D3177208CA47508DDF924D44F224C1
ProjectName=Velox
Description=Fast arena FPS in the spirit of Quake 3 Arena.

[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
UsePakFile=True
bShareMaterialShaderCode=True
+MapsToCook=(FilePath="/Game/Maps/L_Empty")
+MapsToCook=(FilePath="/Game/Maps/L_MovementTest")

[/Script/Engine.GameNetworkManager]
; ADR 0002 section 5. Client sends moves at <= 60 Hz.
ClientNetSendMoveDeltaTime=0.0166
MaxMoveDeltaTime=0.125
; Speedhack guard: server tracks client move time against real time.
bMovementTimeDiscrepancyDetection=True
bMovementTimeDiscrepancyResolution=True
MovementTimeDiscrepancyMaxTimeMargin=0.25
MovementTimeDiscrepancyMinTimeMargin=-0.25
; Engine default (1.73 cm), kept: the sim is deterministic, so corrections are rare and tiny.
MAXPOSITIONERRORSQUARED=3.0

[/Script/GameplayAbilities.AbilitySystemGlobals]
+GameplayCueNotifyPaths="/Game/GameplayCues"

[/Script/Velox.VeloxPlayerState]
; ASC lives on the PlayerState; the server tick (60 Hz) caps the effective rate.
ConfigNetUpdateFrequency=100.0

[/Script/Velox.VeloxPlayerController]
DefaultMappingContext=/Game/Input/IMC_Default.IMC_Default
DefaultMappingContextPriority=0

[/Script/Velox.VeloxCharacter]
DefaultPawnData=/Game/Data/DA_PawnData_Default.DA_PawnData_Default
