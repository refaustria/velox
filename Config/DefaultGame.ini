; Velox - game configuration (ADR 0001 sections 1 and 2).

[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=19D3177208CA47508DDF924D44F224C1
ProjectName=Velox
Description=Fast arena FPS in the spirit of Quake 3 Arena.

[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
UsePakFile=True
bShareMaterialShaderCode=True
+MapsToCook=(FilePath="/Game/Maps/L_Empty")
+MapsToCook=(FilePath="/Game/Maps/L_MovementTest")
+MapsToCook=(FilePath="/Game/Maps/L_CombatTest")
+MapsToCook=(FilePath="/Game/Maps/L_ItemTest")

[/Script/Engine.GameNetworkManager]
; ADR 0002 section 5. Client sends moves at <= 60 Hz.
ClientNetSendMoveDeltaTime=0.0166
MaxMoveDeltaTime=0.125
; Speedhack guard: server tracks client move time against real time.
bMovementTimeDiscrepancyDetection=True
bMovementTimeDiscrepancyResolution=True
MovementTimeDiscrepancyMaxTimeMargin=0.25
MovementTimeDiscrepancyMinTimeMargin=-0.25
; Engine default (1.73 cm), kept: the sim is deterministic, so corrections are rare and tiny.
MAXPOSITIONERRORSQUARED=3.0

; UGameplayAbilitiesDeveloperSettings reads this legacy section (OverrideConfigSection).
[/Script/GameplayAbilities.AbilitySystemGlobals]
+GameplayCueNotifyPaths="/Game/GameplayCues"
; ADR 0003 section 2: allocates FVeloxGameplayEffectContext (hit direction, knockback scale, shot seq, damage flags).
AbilitySystemGlobalsClassName=/Script/Velox.VeloxAbilitySystemGlobals
; ADR 0003 section 5: native cue handling on the pawn; the dedicated server loads no cue notify libraries.
GlobalGameplayCueManagerClass=/Script/Velox.VeloxGameplayCueManager

[/Script/Velox.VeloxPlayerState]
; ASC lives on the PlayerState; the server tick (60 Hz) caps the effective rate.
ConfigNetUpdateFrequency=100.0
; ADR 0003 section 1: combat tunables (the PlayerState exists on server and clients; the game mode only on the server).
CombatSettingsAsset=/Game/Data/DA_CombatSettings_Default.DA_CombatSettings_Default

[/Script/Velox.VeloxPlayerController]
DefaultMappingContext=/Game/Input/IMC_Default.IMC_Default
DefaultMappingContextPriority=0
; ADR 0004 section 7: ready (F3) and scoreboard (Tab, hold) are bound natively on the controller from the same input config as the pawn data.
UIInputConfig=/Game/Data/DA_InputConfig_Default.DA_InputConfig_Default
; ADR 0003 section 8: while the player has no pawn, holding fire or jump requests the respawn (after MinRespawnDelay).
+RespawnInputActions=/Game/Input/IA_Fire.IA_Fire
+RespawnInputActions=/Game/Input/IA_Jump.IA_Jump

[/Script/Velox.VeloxCharacter]
DefaultPawnData=/Game/Data/DA_PawnData_Default.DA_PawnData_Default
; ADR 0003 section 10: unlit emissive body material with a vector parameter "Color" (bootstrap script).
PlayerBodyMaterial=/Game/Materials/M_PlayerBody.M_PlayerBody

; ADR 0004 section 5: game modes as data. The base VeloxGameMode (GlobalDefaultGameMode, M1/M2 test maps and soaks) has
; no definition = match rules off (free play). FFA/Duel select theirs; ?FragLimit=N / ?TimeLimit=S override per match.
; ?game=FFA / ?game=Duel aliases belong in DefaultEngine.ini [/Script/EngineSettings.GameMapsSettings] (task 05 report);
; until then use ?game=/Script/Velox.VeloxGameMode_FFA or ?game=/Script/Velox.VeloxGameMode_Duel.
[/Script/Velox.VeloxGameMode_FFA]
GameModeDefinitionAsset=/Game/Data/DA_GameMode_FFA.DA_GameMode_FFA

[/Script/Velox.VeloxGameMode_Duel]
GameModeDefinitionAsset=/Game/Data/DA_GameMode_Duel.DA_GameMode_Duel

; ADR 0004 section 7: the in-game HUD widget class (C++ UVeloxHUDWidget now; a WBP_HUD subclass replaces the look later without a code change).
[/Script/Velox.VeloxHUD]
HUDWidgetClass=/Script/Velox.VeloxHUDWidget
; ADR 0004 section 7: the scoreboard widget class (a WBP_Scoreboard subclass replaces the look) and its viewport z-order (above the HUD).
ScoreboardWidgetClass=/Script/Velox.VeloxScoreboardWidget
