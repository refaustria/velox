; Velox - engine configuration (ADR 0001 section 1).
; Note: UE ini files only support comments on their own lines; never append "; ..." after a value.

[/Script/EngineSettings.GameMapsSettings]
; M1 switches all three maps to L_MovementTest. L_Empty is created by M0 task 04.
EditorStartupMap=/Game/Maps/L_Empty.L_Empty
GameDefaultMap=/Game/Maps/L_Empty.L_Empty
ServerDefaultMap=/Game/Maps/L_Empty.L_Empty
GlobalDefaultGameMode=/Script/Velox.VeloxGameMode
GameInstanceClass=/Script/Velox.VeloxGameInstance

[/Script/Engine.Engine]
AssetManagerClassName=/Script/Velox.VeloxAssetManager
bSmoothFrameRate=False
!NetDriverDefinitions=ClearArray
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/OnlineSubsystemUtils.IpNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")

; Forward renderer + MSAA, no Nanite/Lumen/VSM, static lighting allowed.
[/Script/Engine.RendererSettings]
r.ForwardShading=True
r.MSAACount=4
; 3 = MSAA (1 = FXAA is the cheap fallback option in settings)
r.AntiAliasingMethod=3
r.Nanite.ProjectEnabled=False
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0
r.GenerateMeshDistanceFields=False
r.AllowStaticLighting=True
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.LensFlare=False
r.DefaultFeature.AmbientOcclusion=False
r.SupportSkyAtmosphere=False
r.VSync=False

[/Script/OnlineSubsystemUtils.IpNetDriver]
; Dedicated server tick is capped by this (UGameEngine::GetMaxTickRate).
NetServerMaxTickRate=60
MaxNetTickRate=60
MaxClientRate=100000
MaxInternetClientRate=100000

[/Script/Engine.Player]
ConfiguredInternetSpeed=100000
ConfiguredLanSpeed=100000

[/Script/Engine.GameNetworkManager]
; Client sends moves at <= 60 Hz.
ClientNetSendMoveDeltaTime=0.0166
MaxMoveDeltaTime=0.125

; Channel names mirror Source/Velox/Core/VeloxCollisionChannels.h.
[/Script/Engine.CollisionProfile]
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,Name="Weapon")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Block,bTraceType=False,Name="Projectile")

[SystemSettings]
net.IsPushModelEnabled=1
; Classic replication until M6 (ADR 0001). Game/Editor targets on installed engines cannot set bUseIris=false at
; compile time, so Iris is kept off at runtime here.
net.Iris.UseIrisReplication=0
