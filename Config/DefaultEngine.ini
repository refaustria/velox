; Velox - engine configuration (ADR 0001 section 1).
; Note: UE ini files only support comments on their own lines; never append "; ..." after a value.

[/Script/EngineSettings.GameMapsSettings]
; M1 switches all three maps to L_MovementTest. L_Empty is created by M0 task 04.
; M3 (ADR 0004 sections 7 and 8): editor start and dedicated server open L_ItemTest; the standalone game and every return from a match open the front-end map L_MainMenu (task 10).
EditorStartupMap=/Game/Maps/L_ItemTest.L_ItemTest
GameDefaultMap=/Game/Maps/L_MainMenu.L_MainMenu
ServerDefaultMap=/Game/Maps/L_ItemTest.L_ItemTest
+GameModeClassAliases=(Name="FFA",GameMode="/Script/Velox.VeloxGameMode_FFA")
+GameModeClassAliases=(Name="Duel",GameMode="/Script/Velox.VeloxGameMode_Duel")
GlobalDefaultGameMode=/Script/Velox.VeloxGameMode
GameInstanceClass=/Script/Velox.VeloxGameInstance

[/Script/Engine.Engine]
AssetManagerClassName=/Script/Velox.VeloxAssetManager
bSmoothFrameRate=False
; ADR 0004 section 7: sensitivity, FOV, crosshair, audio, AA, name; persisted in Saved/Config/<Platform>/GameUserSettings.ini.
GameUserSettingsClassName=/Script/Velox.VeloxGameUserSettings
; M3-13 F5: sends Name=<PlayerName> as a login option (the server ignores the ?Name= of the travel URL).
LocalPlayerClassName=/Script/Velox.VeloxLocalPlayer
; NetDriverDefinitions: BaseEngine.ini already maps GameNetDriver to IpNetDriver (and keeps Beacon/Demo drivers for M7 replays), so no override.

; Forward renderer + MSAA, no Nanite/Lumen/VSM, static lighting allowed.
[/Script/Engine.RendererSettings]
r.ForwardShading=True
r.MSAACount=4
; 3 = MSAA (1 = FXAA is the cheap fallback option in settings)
r.AntiAliasingMethod=3
r.Nanite.ProjectEnabled=False
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0
r.GenerateMeshDistanceFields=False
r.AllowStaticLighting=True
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.LensFlare=False
r.DefaultFeature.AmbientOcclusion=False
r.SupportSkyAtmosphere=False
r.VSync=False

; ADR 0002 section 5: the engine default 4000 cm/s would cap long falls and pad launches.
[/Script/Engine.PhysicsSettings]
DefaultTerminalVelocity=10000

[/Script/OnlineSubsystemUtils.IpNetDriver]
; Dedicated server tick is capped by this (UGameEngine::GetMaxTickRate).
NetServerMaxTickRate=60
MaxNetTickRate=60
MaxClientRate=100000
MaxInternetClientRate=100000

[/Script/Engine.Player]
ConfiguredInternetSpeed=100000
ConfiguredLanSpeed=100000

; Channel names mirror Source/Velox/Core/VeloxCollisionChannels.h.
[/Script/Engine.CollisionProfile]
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,Name="Weapon")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Block,bTraceType=False,Name="Projectile")

[SystemSettings]
net.IsPushModelEnabled=1
; Classic replication until M6 (ADR 0001). UE 5.8 has no bUseIris target setting; Iris is always compiled in and
; is switched off at runtime here.
net.Iris.UseIrisReplication=0

[ConsoleVariables]
; ADR 0002 A17-A19: the response container (grace/latch chained through a replay) only exists on the packed RPC path.
p.NetUsePackedMovementRPCs=1

; ADR 0005 section 3 (M4 bots): Recast nav mesh generated at runtime on the server, one agent with the pawn's geometry
; (capsule 37.5 x 70 half height, MaxStepHeight 45, WalkableFloorAngle 45.5). Clients build and load no nav data.
; Task M4-04b: AgentRadius 45 (capsule 37.5 + 7.5 margin) keeps paths off wall corners (inner corners of L_ItemTest's cross
; caught strafing bots); gaps narrower than 90 cm now have no mesh, the controller's off-mesh recovery walks bots out.
; Nav bounds: in 5.8 bWholeWorldNavigable is not a UPROPERTY (NavigationSystem.h, "currently broken"), so an ini key has
; no effect; the map scripts place one NavMeshBoundsVolume per greybox map instead (task M4-01).
[/Script/NavigationSystem.NavigationSystemV1]
bAutoCreateNavigationData=True
bAllowClientSideNavigation=False
bInitialBuildingLocked=False
!SupportedAgents=ClearArray
+SupportedAgents=(Name="VeloxPawn",Color=(R=0,G=255,B=0,A=255),DefaultQueryExtent=(X=100,Y=100,Z=200),NavDataClass=/Script/NavigationSystem.RecastNavMesh,AgentRadius=45,AgentHeight=140,AgentStepHeight=45,NavWalkingSearchHeightScale=0.5)

; Key names verified against the 5.8 BaseEngine.ini / RecastNavMesh.h: NavMeshResolutionParams is a fixed array indexed
; by ENavigationDataResolution (Low, Default, High); the flat CellSize/CellHeight/AgentMaxStepHeight are deprecated.
[/Script/NavigationSystem.RecastNavMesh]
RuntimeGeneration=Dynamic
AgentRadius=45
AgentHeight=140
AgentMaxSlope=45.5
TileSizeUU=1000
NavMeshResolutionParams[0]=(CellSize=19.000000,CellHeight=10.000000,AgentMaxStepHeight=45.000000)
NavMeshResolutionParams[1]=(CellSize=19.000000,CellHeight=10.000000,AgentMaxStepHeight=45.000000)
NavMeshResolutionParams[2]=(CellSize=19.000000,CellHeight=10.000000,AgentMaxStepHeight=45.000000)
bDrawPolyEdges=False
